[package]
name = "mugon"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mugon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the system tray (§4.9); `image-png` so `Image::from_bytes`
# can decode the tray glyphs, which are PNG rather than ICO.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Task 9b: `#[implement(IMMNotificationClient)]` expands to `::windows_core::…`
# paths, so the crate `windows` re-exports as `windows::core` must also be a
# direct dependency by its own name. Same version `windows` itself resolves to,
# so the two are one crate instance and the generated code lines up with the
# interface definitions it implements.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
tempfile = "3"

